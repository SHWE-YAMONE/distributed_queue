services:
  redis:
    image: redis:7-alpine
    container_name: queue_broker
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
    volumes:
      - redis_data:/data

  api:
    build: .
    environment:
      - REDIS_HOST=redis
    ports:
      - "8000:8000"
    command: uvicorn api.main:app --host 0.0.0.0 --reload
    depends_on:
      redis: { condition: service_healthy }

  worker:
    build: .
    environment:
      - REDIS_HOST=redis
    command: python -m worker.worker
    deploy:
      replicas: 3
    depends_on:
      redis: { condition: service_healthy }

  scheduler:
    build: .
    environment:
      - REDIS_HOST=redis
    command: python -m worker.scheduler
    depends_on:
      - redis

  dashboard:
    build: .
    environment:
      - REDIS_HOST=redis
    command: python -m dashboard.monitor
    depends_on:
      - redis

volumes:
  redis_data: